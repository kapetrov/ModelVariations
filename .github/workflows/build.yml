name: Build

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "plugin-sdk full commit SHA, branch or tag"
        required: false
        default: "8b9748a0de0e5abacd3a4655ca14fbf7ba7b2988"
  push:
  pull_request:

env:
  # pinned before the 2026-04-12 GetMatrix() refactor, the mod still expects CMatrixLink*
  PLUGIN_SDK_REF: ${{ github.event.inputs.sdk_ref || '8b9748a0de0e5abacd3a4655ca14fbf7ba7b2988' }}

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config:
          - { mod: "GTASA Release", sdk: "Release" }
          - { mod: "GTASA zDebug", sdk: "zDebug" }

    steps:
      - name: Checkout mod
        uses: actions/checkout@v4

      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          ref: ${{ env.PLUGIN_SDK_REF }}
          path: plugin-sdk
          fetch-depth: 0
          submodules: recursive

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate plugin-sdk solution (vs2022, toolset v143)
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          "%PLUGIN_SDK_DIR%\tools\premake\premake5.exe" vs2022 --file="%PLUGIN_SDK_DIR%\tools\premake\premake5.lua"

      - name: Build plugin-sdk (plugin_sa)
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          msbuild "%PLUGIN_SDK_DIR%\plugin.sln" /t:plugin_sa /p:Configuration=${{ matrix.config.sdk }} /p:Platform="Mixed Platforms" /m /v:minimal

      - name: Build ModelVariations
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          set GTA_SA_DIR=%GITHUB_WORKSPACE%\out
          msbuild ModelVariations.sln /p:Configuration="${{ matrix.config.mod }}" /p:Platform=x86 /m /v:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModelVariations-${{ matrix.config.sdk }}
          path: |
            out/*.asi
            out/*.pdb
          if-no-files-found: error
